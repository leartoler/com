<!DOCTYPE html>
 
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css?family=Indie+Flower"

    <body>
        <main class="escena">
            <img
                src="./d6.png"
                usemap="#mesa" alt="mesa"
                style="width: 100%; height: 100%;" id="mesa">
            <div class="flor"
                onclick="location.href='./d4.png'">
            </div>
            <div class="enviar"
                onclick="location.href='/'">

            <div class="reloj"
                onclick="location.href='./d8.png'">

                onclick="location.href='./d5.png'">

            <div class="vaso"

            <div class="card">

                <div class="details">
                    <h4 class="color1">
                    </h2>
                    <h4 class="color2 margin">
                    </h3>
                    <p>Viaje a Cobá</p>
                    <p>Se vió el día de hoy grandes pirámides.</p>
                    <p>Y una densa vegetación</p>

                    <p>puedo ver las grandes piramides de xpujil y medirlas</p>
                    <p>o ver las grandes piezas que hay en calakmul</p>
