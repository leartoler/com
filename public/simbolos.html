<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simbolos</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #5f8265;
      --linea: #d48ac8;
      --ink: #7a3d70;
      --white: #ffffff;
      --muted: #6b6f3a;
      --error: #b3251f;
      --ok: #7a3d70;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Barlow Condensed', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      position: relative;
    }

    .fondo-textura {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-radial-gradient(circle at 50% 42%, rgba(0, 0, 0, .05) 0 1.5px, transparent 1.5px 22px);
    }

    .fondo-final {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: url('./cultura.png');
      background-size: cover;
      background-position: center;
    }

    .fondo-final.oculto {
      display: none !important;
    }

    .marca {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-family: 'Archivo Black', sans-serif;
      font-size: .95rem;
      letter-spacing: .04em;
      color: var(--ink);
    }

    .pantalla {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .oculto {
      display: none !important;
    }

    .subtitulo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      color: var(--ink);
      font-size: 1.3rem;
      margin: 0 0 24px;
      line-height: 1.4;
    }

    input[type="text"] {
      width: 100%;
      max-width: 320px;
      padding: 12px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .95rem;
      border: 2px solid var(--ink);
      background: var(--white);
      color: var(--ink);
      outline: none;
      border-radius: 0;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    input[type="text"]:focus {
      border-color: var(--linea);
    }

    button {
      display: inline-block;
      margin-top: 20px;
      margin-inline: 6px;
      font-family: 'Archivo Black', sans-serif;
      font-size: .7rem;
      letter-spacing: .08em;
      padding: 13px 24px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    button.secundario {
      background: rgba(255, 255, 255, .55);
      color: var(--ink);
    }

    button:hover {
      background: var(--linea);
      border-color: var(--linea);
      color: var(--white);
    }

    button.secundario:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }

    .instruccion {
      max-width: 520px;
      margin: 0 auto 28px;
      font-size: .95rem;
      line-height: 1.5;
      font-style: italic;
      color: var(--ink);
    }

    .instruccion strong {
      display: block;
      margin-top: 14px;
      font-style: normal;
      font-family: 'Archivo Black', sans-serif;
      font-size: .72rem;
      letter-spacing: .06em;
      color: var(--linea);
    }

    .grupos-scroll {
      overflow-x: auto;
      padding: 8px 4px 16px;
    }

    .grupos {
      display: flex;
      flex-direction: row;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
      width: fit-content;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      gap: 58px 7px;
    }

    .cuadro {
      position: relative;
      border-radius: 3px;
      background: var(--bg);
      border: 2px solid var(--linea);
      overflow: hidden;
      cursor: default;
    }

    .cuadro.activo {
      cursor: pointer;
      border-color: var(--ink);
    }

    .cuadro.acierto {
      overflow: visible;
      background: var(--muted);
      border-color: var(--ok);
    }

    .cuadro.fallo {
      background: rgba(179, 37, 31, 0.12);
      border-color: var(--error);
    }

    .zona-central {
      position: absolute;
      left: 40%;
      width: 20%;
      top: 0;
      bottom: 0;
      background: var(--ink);
    }

    .linea-centro {
      position: absolute;
      left: 50%;
      top: 8%;
      bottom: 8%;
      width: 2px;
      transform: translateX(-50%);
      background: rgba(200, 85, 28, .55);
    }

    .imagen-movil {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60%;
      height: 60%;
      object-fit: contain;
      border-radius: 4px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .imagen-revelada {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .palabra-revelada {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--ok);
      text-align: center;
      padding: 0 4px;
      line-height: 1.15;
      word-break: break-word;
    }

    .mensaje-final {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1rem;
      letter-spacing: .02em;
      margin: 0 0 16px;
      line-height: 1.5;
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255, 255, 255, .75);
    }

    .contenido-resultado {
      max-width: 420px;
      margin: 0 auto 20px;
      padding: 14px 18px;
      background: var(--white);
      border: 2px solid var(--ink);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--ink);
      text-align: left;
      white-space: pre-wrap;
    }

    .contenido-resultado.vacio {
      color: var(--muted);
      font-style: italic;
    }

    .lista-correos {
      margin: 0 auto 24px;
      max-width: 420px;
      padding: 14px 18px;
      background: var(--white);
      border: 2px solid var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
    }

    .lista-correos div {
      padding: 2px 0;
    }

    /*glitch*/

    .stage.glitching {
      animation: glitch-flicker .32s steps(2, end);
    }

    @keyframes glitch-flicker {
      0% {
        filter: none;
        transform: translate(0, 0);
      }

      10% {
        filter: brightness(1.5) contrast(1.3);
        transform: translate(-3px, 1px);
      }

      22% {
        filter: brightness(.3) saturate(0);
        transform: translate(3px, -1px);
      }

      38% {
        filter: brightness(1.8) hue-rotate(15deg);
        transform: translate(-2px, 0);
      }

      52% {
        filter: none;
        transform: translate(1px, 1px);
      }

      68% {
        filter: brightness(.4);
        transform: translate(-1px, 0);
      }

      100% {
        filter: none;
        transform: translate(0, 0);
      }
    }

    .glitch-line {
      position: fixed;
      left: 0;
      width: 100%;
      height: 0;
      background: var(--accent);
      opacity: 0;
      mix-blend-mode: difference;
      z-index: 50;
      pointer-events: none;
    }

    .stage.glitching .glitch-line {
      animation: glitch-line-anim .3s steps(4, end);
    }

    @keyframes glitch-line-anim {
      0% {
        height: 0;
        opacity: 0;
      }

      15% {
        height: 8px;
        opacity: .85;
      }

      40% {
        height: 2px;
        opacity: .5;
      }

      65% {
        height: 14px;
        opacity: .7;
      }

      100% {
        height: 0;
        opacity: 0;
      }
    }

    .glitch-noise {
      position: fixed;
      inset: 0;
      z-index: 49;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .5) 0 1px, transparent 1px 4px);
    }

    .stage.glitching .glitch-noise {
      animation: glitch-noise-anim .32s steps(2, end);
    }

    @keyframes glitch-noise-anim {

      0%,
      100% {
        opacity: 0;
      }

      20%,
      55% {
        opacity: .12;
      }
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="glitch-noise" aria-hidden="true"></div>
    <div class="glitch-line" id="glitchLine" aria-hidden="true"></div>


  <div class="fondo-textura" aria-hidden="true"></div>
  <div class="fondo-final oculto" id="fondo-final" aria-hidden="true"></div>
  <div class="marca">0x000042</div>

  <div id="pantalla-nombre" class="pantalla">
    <p class="subtitulo">Nombre, expresión o concepto con el que quieras
      firmar y jugar</p>
    <input type="text" id="input-nombre" placeholder="Escribe aquí" maxlength="40">
    <br>
    <button id="boton-empezar">Iniciar</button>
  </div>

  <div id="pantalla-juego" class="pantalla oculto">
    <p class="instruccion">
      Escribes una carta. Figuras repetidas, productos culturales similares,
      solo queda un simbolismo aparente.
      <strong>Nuestro tiempo se agota</strong>
    </p>
    <div class="grupos-scroll">
      <div class="grupos" id="grupos"></div>
    </div>
  </div>

  <!-- Pantalla: terminado -->
  <div id="pantalla-final" class="pantalla oculto">
    <p class="mensaje-final" id="mensaje-final"></p>
    <div class="contenido-resultado oculto" id="contenido-resultado"></div>
    <div class="lista-correos oculto" id="lista-correos"></div>
    <div>
      <button id="boton-reiniciar">Escribir carta de nuevo</button>
      <button id="boton-regresar" class="secundario">Regresar a la vida...</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var $ = function(id){ return document.getElementById(id); };

        var stage = $('stage');



      const GRUPOS_PATRON = [
        ['xxo', 'xxo', 'oxo'],
        ['xxo', 'oxo', 'xxo', 'xxx'],
        ['xoo', 'xoo', 'xxo', 'xoo', 'xoo'],
      ];

      const TAMANIO_CUADRO = 92; // px

      const DURACION_MS = 4500;

      const ZONA_CENTRAL_INICIO = 40;

      const ZONA_CENTRAL_FIN = 60;

      const AMPLITUD = 35;

      const PORCENTAJE_MINIMO = 0.2;

      const API_ENVIAR_CORREO = 'https://com-three-inky.vercel.app/api/enviar-correo';



      // A dónde lleva el botón "Regresar a la habitación". Reemplaza esta ruta.
      const URL_HABITACION = 'https://desaparecidos.0x000042.com';


      /*estructura*/

      let indiceGlobal = 0;
      const GRUPOS = GRUPOS_PATRON.map((filasGrupo) => {
        const celdas = [];
        filasGrupo.forEach((fila, indiceFila) => {
          fila.split('').forEach((caracter, indiceColumna) => {
            if (caracter === 'x') {
              celdas.push({ fila: indiceFila, columna: indiceColumna, indice: indiceGlobal });
              indiceGlobal += 1;
            }
          });
        });
        return {
          filas: filasGrupo.length,
          columnas: filasGrupo[0].length,
          celdas,
        };
      });

      const TOTAL_CUADROS = indiceGlobal;



      const PALABRAS = [
        'La voz',
        'no debe callar',
        'El cuerpo,',
        'no debe parar.',
        'La letra',
        'debe fluir.',
        'Porque',
        'ante,',
        'este futuro',
        'incierto,',
        'el arte,',
        'nuestra',
        'expresión,',
        'nuestra',
        'voz',
        'se',
        'convierte',
        'en',
        'deber.',



      ]


      const IMAGENES = [
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',
        'c2.png',


      ]
      //  Estado 

      let nombreJugador = '';
      let secuencia = [];
      let turno = 0;
      let resultados = new Array(TOTAL_CUADROS).fill(null); // null | 'acierto' | 'fallo'
      let cuadroActivo = null;
      let progresoActual = 50;
      let direccion = 1;
      let inicioAnimacion = 0;
      let rafId = null;
      let turnoTerminado = false;

      //  Elementos del DOM 

      const pantallaNombre = document.getElementById('pantalla-nombre');
      const pantallaJuego = document.getElementById('pantalla-juego');
      const pantallaFinal = document.getElementById('pantalla-final');
      const fondoFinal = document.getElementById('fondo-final');

      const inputNombre = document.getElementById('input-nombre');
      const botonEmpezar = document.getElementById('boton-empezar');
      const botonReiniciar = document.getElementById('boton-reiniciar');
      const botonRegresar = document.getElementById('boton-regresar');

      const contenedorGrupos = document.getElementById('grupos');

      const mensajeFinal = document.getElementById('mensaje-final');
      const contenidoResultado = document.getElementById('contenido-resultado');
      const listaCorreos = document.getElementById('lista-correos');

      //  Utilidades 

      function mezclarArray(arr) {
        const copia = arr.slice();
        for (let i = copia.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        return copia;
      }

      function mostrarPantalla(pantalla) {
        pantallaNombre.classList.add('oculto');
        pantallaJuego.classList.add('oculto');
        pantallaFinal.classList.add('oculto');
        pantalla.classList.remove('oculto');

        fondoFinal.classList.toggle('oculto', pantalla !== pantallaFinal);
      }

      //    grid 

      var glitchLine = $('glitchLine');
      function triggerGlitch() {
        glitchLine.style.top = (Math.random() * 88 + 4) + '%';
        stage.classList.remove('glitching');
        void stage.offsetWidth;
        stage.classList.add('glitching');
        setTimeout(function () { stage.classList.remove('glitching'); }, 340);
      }
      function scheduleGlitch() {
        var delay = 5000 + Math.random() * 11000;
        setTimeout(function () { triggerGlitch(); scheduleGlitch(); }, delay);
      }
      if (!reduceMotion) { scheduleGlitch(); }



      function construirGrupos() {
        contenedorGrupos.innerHTML = '';

        GRUPOS.forEach((grupo) => {
          const gridGrupo = document.createElement('div');
          gridGrupo.className = 'grid';
          gridGrupo.style.gridTemplateColumns = 'repeat(' + grupo.columnas + ', ' + TAMANIO_CUADRO + 'px)';
          gridGrupo.style.gridTemplateRows = 'repeat(' + grupo.filas + ', ' + TAMANIO_CUADRO + 'px)';

          grupo.celdas.forEach((posicion) => {
            const celda = document.createElement('div');
            celda.className = 'cuadro';
            celda.dataset.indice = String(posicion.indice);
            celda.style.gridColumn = String(posicion.columna + 1);
            celda.style.gridRow = String(posicion.fila + 1);
            celda.addEventListener('click', () => manejarClickCuadro(posicion.indice));
            gridGrupo.appendChild(celda);
          });

          contenedorGrupos.appendChild(gridGrupo);
        });
      }

      function obtenerCelda(indice) {
        return contenedorGrupos.querySelector('[data-indice="' + indice + '"]');
      }

      function renderizarCelda(indice) {
        const celda = obtenerCelda(indice);
        if (!celda) return;

        celda.innerHTML = '';
        celda.classList.remove('activo', 'acierto', 'fallo');

        const resultado = resultados[indice];

        if (resultado === 'acierto') {
          celda.classList.add('acierto');
          const img = document.createElement('img');
          img.className = 'imagen-revelada';
          img.src = IMAGENES[indice];
          img.alt = 'dibujo';
          celda.appendChild(img);

          const palabra = document.createElement('div');
          palabra.className = 'palabra-revelada';
          palabra.textContent = PALABRAS[indice];
          celda.appendChild(palabra);
          return;
        }

        if (resultado === 'fallo') {
          celda.classList.add('fallo');
          return;
        }

        if (cuadroActivo === indice) {
          celda.classList.add('activo');
          const zona = document.createElement('div');
          zona.className = 'zona-central';
          celda.appendChild(zona);

          const img = document.createElement('img');
          img.className = 'imagen-movil';
          img.src = IMAGENES[indice];
          img.alt = 'dibujo';
          img.id = 'imagen-activa';
          img.style.left = '50%';
          celda.appendChild(img);

          const linea = document.createElement('div');
          linea.className = 'linea-centro';
          linea.id = 'linea-activa';
          linea.style.left = '50%';
          celda.appendChild(linea);
          return;
        }

        const zona = document.createElement('div');
        zona.className = 'zona-central';
        celda.appendChild(zona);
      }

      //  Lógica del turno 

      function iniciarJuego() {
        nombreJugador = inputNombre.value.trim();
        if (!nombreJugador) return;

        secuencia = mezclarArray(Array.from({ length: TOTAL_CUADROS }, (_, i) => i));
        resultados = new Array(TOTAL_CUADROS).fill(null);
        turno = 0;

        construirGrupos();
        for (let i = 0; i < TOTAL_CUADROS; i++) renderizarCelda(i);

        mostrarPantalla(pantallaJuego);
        siguienteTurno();
      }

      function siguienteTurno() {
        if (turno >= secuencia.length) {
          finalizarJuego();
          return;
        }

        const indiceAnterior = cuadroActivo;
        const indiceCuadro = secuencia[turno];

        cuadroActivo = indiceCuadro;
        turnoTerminado = false;
        direccion = Math.random() < 0.5 ? 1 : -1;
        progresoActual = 50;

        if (indiceAnterior !== null) renderizarCelda(indiceAnterior);
        renderizarCelda(indiceCuadro);

        inicioAnimacion = performance.now();
        rafId = requestAnimationFrame(animar);
      }

      function animar(ahora) {
        const transcurrido = ahora - inicioAnimacion;
        const t = transcurrido / DURACION_MS;
        const progreso = 50 - direccion * AMPLITUD * Math.cos(t * Math.PI * 4);
        progresoActual = progreso;

        const imagenActiva = document.getElementById('imagen-activa');
        if (imagenActiva) imagenActiva.style.left = progreso + '%';

        const lineaActiva = document.getElementById('linea-activa');
        if (lineaActiva) lineaActiva.style.left = progreso + '%';

        if (transcurrido < DURACION_MS) {
          rafId = requestAnimationFrame(animar);
        } else {
          terminarTurno('fallo', cuadroActivo);
        }
      }

      function manejarClickCuadro(indice) {
        if (cuadroActivo !== indice || turnoTerminado) return;
        const acierto = progresoActual >= ZONA_CENTRAL_INICIO && progresoActual <= ZONA_CENTRAL_FIN;
        terminarTurno(acierto ? 'acierto' : 'fallo', indice);
      }

      function terminarTurno(resultado, indice) {
        if (turnoTerminado) return;
        turnoTerminado = true;
        if (rafId) cancelAnimationFrame(rafId);

        resultados[indice] = resultado;
        cuadroActivo = null;
        renderizarCelda(indice);

        turno += 1;
        siguienteTurno();
      }

      //  Fin del juego 


      function reconstruirCarta() {
        return resultados
          .map((r, i) => (r === 'acierto' ? PALABRAS[i] : null))
          .filter((palabra) => palabra !== null)
          .join(' ');
      }

      function mostrarContenidoResultado(texto) {
        if (texto) {
          contenidoResultado.textContent = texto;
          contenidoResultado.classList.remove('oculto', 'vacio');
        } else {
          contenidoResultado.textContent = 'carta…';
          contenidoResultado.classList.remove('oculto');
          contenidoResultado.classList.add('vacio');
        }
      }

      function finalizarJuego() {
        const totalAciertos = resultados.filter((r) => r === 'acierto').length;
        mostrarPantalla(pantallaFinal);
        mostrarContenidoResultado(reconstruirCarta());
        listaCorreos.classList.add('oculto');
        listaCorreos.innerHTML = '';

        if (totalAciertos / TOTAL_CUADROS >= PORCENTAJE_MINIMO) {
          mensajeFinal.textContent = 'Enviando la carta...';
          enviarCorreo(nombreJugador);
        } else {
          mensajeFinal.textContent = 'La carta no se envió.';
        }
      }

      function enviarCorreo(nombre) {
        fetch(API_ENVIAR_CORREO, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, juego: 'simbolos', contenido: reconstruirCarta() }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data && data.success) {
              mensajeFinal.textContent = 'Carta enviada a quien la necesite ver';
              if (Array.isArray(data.destinatarios) && data.destinatarios.length > 0) {
                listaCorreos.classList.remove('oculto');
                data.destinatarios.forEach((correo) => {
                  const linea = document.createElement('div');
                  linea.textContent = correo;
                  listaCorreos.appendChild(linea);
                });
              }
            } else {
              mensajeFinal.textContent = 'La carta no se pudo enviar.';
            }
          })
          .catch(() => {
            mensajeFinal.textContent = 'La carta no se pudo enviar.';
          });
      }

      //  Eventos 

      botonEmpezar.addEventListener('click', iniciarJuego);
      inputNombre.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') iniciarJuego();
      });
      botonReiniciar.addEventListener('click', () => {
        mostrarPantalla(pantallaNombre);
        inputNombre.value = '';
        inputNombre.focus();
      });
      botonRegresar.addEventListener('click', () => {
        window.location.href = URL_HABITACION;
      });

    })();
  </script>

</body>
